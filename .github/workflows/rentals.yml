name: rentals refresh

# Twice-daily feed refresh: 08:00 and 20:00 Sri Lanka time (02:30 / 14:30 UTC).
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch: # manual "Run workflow" button too

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps + browser
        working-directory: scraper
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch latest listings
        working-directory: scraper
        run: node fetch-rentals.js

      - name: Publish feed next to the app
        run: |
          N=$(node -e "const fs=require('fs'); try{console.log(JSON.parse(fs.readFileSync('scraper/listings.json','utf8')).length)}catch(e){console.log(0)}")
          echo "feed entries: $N"
          if [ "$N" -gt 0 ]; then
            cp scraper/listings.json listings.json
            echo "published=$N" >> "$GITHUB_ENV"
          else
            echo "empty feed — keeping previous listings.json"
            exit 1
          fi

      - name: Commit refreshed feed
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "rentals refresh"
          file_pattern: "listings.json scraper/listings.json"
